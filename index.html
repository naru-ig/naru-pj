function buildTulipSegments() {
    const segments = [];
    const cx = 480;
    const stream = Array.from(PHRASES.join("   ✦   ") + "   ✦   ");
    let streamIndex = 0;

    function textSlice(length) {
        if (length <= 0) return "";
        let out = [];
        let remaining = length;
        while (remaining > 0) {
            const take = Math.min(remaining, stream.length - streamIndex);
            out.push(stream.slice(streamIndex, streamIndex + take).join(""));
            streamIndex = (streamIndex + take) % stream.length;
            remaining -= take;
        }
        return out.join("");
    }

    for (let y = 745; y > 439; y -= 11) {
        const stemX = cx + Math.trunc(10 * Math.sin((y - 440) / 55.0));
        const stemColor = Math.floor(y / 11) % 2 === 0 ? "#10b981" : "#34d399";
        segments.push([stemX, y, textSlice(6), stemColor, 9]);

        if (y >= 495 && y <= 715) {
            const p = (715 - y) / 220.0;
            const archOffset = Math.trunc(195 * Math.sin(p * Math.PI * 0.82));
            const width = Math.trunc(20 * Math.sin(p * Math.PI) * (1 - 0.25 * p));
            if (width >= 3) {
                const leafColor = p < 0.5 ? "#059669" : "#10b981";
                segments.push([stemX - Math.floor(archOffset / 2) - 28, y, textSlice(width), leafColor, 9]);
                segments.push([stemX + Math.floor(archOffset / 2) + 28, y, textSlice(width), leafColor, 9]);
            }
        }
    }

    for (let y = 440; y > 134; y -= 10) {
        const t = (440 - y) / 305.0;
        if (t < 0.68) {
            const cupCurve = Math.sin((t / 0.68) * (Math.PI / 2));
            const halfWidth = Math.trunc(215 * cupCurve);
            const innerChars = Math.max(4, Math.trunc(halfWidth * 1.15 / 6.2));
            segments.push([cx, y, textSlice(innerChars), "#9d174d", 9]);

            const outerChars = Math.max(4, Math.trunc(halfWidth * 0.92 / 6.0));
            const leftColor = Math.floor(y / 10) % 2 === 0 ? "#fb7185" : "#f43f5e";
            const rightColor = Math.floor(y / 10) % 2 === 0 ? "#f43f5e" : "#fda4af";
            const offset = Math.trunc(halfWidth * 0.46);
            segments.push([cx - offset, y, textSlice(outerChars), leftColor, 10]);
            segments.push([cx + offset, y, textSlice(outerChars), rightColor, 10]);
        } else {
            const tipT = (t - 0.68) / 0.32;
            if (tipT < 0.65) {
                const backT = tipT / 0.65;
                const backChars = Math.max(2, Math.trunc(11 * (1 - backT)));
                segments.push([cx - 66, y, textSlice(backChars), "#be185d", 9]);
                segments.push([cx + 66, y, textSlice(backChars), "#be185d", 9]);
            }

            const petalWidth = Math.trunc(68 * (1 - Math.pow(tipT, 1.35)));
            const charLen = Math.max(2, Math.trunc(petalWidth * 2 / 6.4));
            if (charLen >= 2) {
                const shift = Math.trunc(128 + 14 * tipT);
                segments.push([cx - shift, y, textSlice(charLen), "#fb7185", 10]);
                segments.push([cx, y, textSlice(charLen + 2), "#e11d48", 10]);
                segments.push([cx + shift, y, textSlice(charLen), "#fda4af", 10]);
            }
        }
    }
    return segments;
}

        size: Math.floor(Math.random() * (15 - 9 + 1)) + 9,
        phase: Math.random() * 6.28,
        speed: 0.6 + Math.random() * 0.8
    });
}

function updateParticles() {
    for (const p of particles) {
        p.phase += 0.06;
        p.y -= p.speed;
        if (p.y < 75) {
            p.y = 810;
            p.originX = Math.floor(Math.random() * (910 - 50 + 1)) + 50;
        }
        p.x = p.originX + Math.sin(p.phase) * 14;
    }
}
